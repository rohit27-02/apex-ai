[project]
name = "todo-service"
version = "1.0.0"
description = "A small FastAPI todo service used as the target repo for the APEX-AI control plane."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
